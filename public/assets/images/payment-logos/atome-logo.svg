<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Atome Circle -->
  <circle cx="100" cy="100" r="90" fill="#FF6B00" opacity="0.1"/>
  
  <!-- Main Atome Logo - Orange Circle Split Design -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FF6B00" stroke-width="8"/>
  
  <!-- Top Circle -->
  <circle cx="70" cy="70" r="25" fill="#FF6B00"/>
  
  <!-- Middle Circle -->
  <circle cx="130" cy="100" r="25" fill="#FF6B00"/>
  
  <!-- Bottom Circle -->
  <circle cx="70" cy="130" r="25" fill="#FF6B00"/>
  
  <!-- Letter A in the center -->
  <text x="100" y="115" font-size="48" font-weight="bold" fill="#FF6B00" text-anchor="middle" font-family="Arial, sans-serif">A</text>
  
  <!-- Atome Text -->
  <text x="100" y="175" font-size="16" font-weight="bold" fill="#FF6B00" text-anchor="middle" font-family="Arial, sans-serif">ATOME</text>
</svg>
